[package]
name = "async-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"
license = "Apache-2.0 OR MIT"
description = "A priority-aware native async runtime for the smol ecosystem with host-driven local domains"
readme = "README.md"
documentation = "https://docs.rs/async-runtime"
keywords = ["async", "executor", "runtime", "priority", "smol"]
categories = ["asynchronous", "concurrency"]

[dependencies]
async-channel = "2.5"
async-executor = "1.14"
async-task = "4.7"
futures-lite = "2.6"

[dev-dependencies]
async-io = "2.6"
criterion = "0.5.1"
trybuild = "=1.0.110"

[[bench]]
name = "executor"
harness = false
