[package]
name = "async-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0 OR MIT"
description = "A small priority-aware async runtime with host-driven local domains"
readme = "README.md"
documentation = "https://docs.rs/async-runtime"
keywords = ["async", "executor", "runtime", "priority"]
categories = ["asynchronous", "concurrency"]

[dependencies]
async-channel = "2.5"
async-executor = "1.14"
async-io = "2.6"
async-task = "4.7"
futures-lite = "2.6"

[dev-dependencies]
criterion = "0.7"
trybuild = "=1.0.119"

[[bench]]
name = "executor"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
