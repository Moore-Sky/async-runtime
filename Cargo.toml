[package]
name = "async-runtime"
version = "0.3.0"
edition = "2021"
rust-version = "1.71"
license = "Apache-2.0 OR MIT"
description = "A priority-aware native async runtime for the smol ecosystem with host-driven local domains"
readme = "README.md"
documentation = "https://docs.rs/async-runtime"
keywords = ["async", "executor", "runtime", "priority", "smol"]
categories = ["asynchronous", "concurrency"]
exclude = ["改进计划.md"]

[dependencies]
async-channel = "2.5"
async-executor = "1.14"
async-task = "4.7"
crossbeam-deque = "0.8.7"
futures-lite = "2.6"

[features]
default = []
stats = []

[dev-dependencies]
async-io = "2.6"
criterion = "0.5.1"
trybuild = "=1.0.110"

[[bench]]
name = "general_spawn"
harness = false

[[bench]]
name = "priority"
harness = false

[[bench]]
name = "local_driving"
harness = false

[[bench]]
name = "local_dispatch"
harness = false

[[bench]]
name = "frame_like"
harness = false

[[bench]]
name = "shutdown"
harness = false

[[bench]]
name = "yield_storm"
harness = false

[[bench]]
name = "v030_nested_locality"
harness = false

[[bench]]
name = "v030_external_producers"
harness = false

[[bench]]
name = "v030_steal_imbalance"
harness = false

[[bench]]
name = "v030_priority_latency"
harness = false

[[bench]]
name = "v030_starvation"
harness = false

[[bench]]
name = "v030_idle_wake"
harness = false
required-features = ["stats"]

[[bench]]
name = "v030_yield_wake_storm"
harness = false
